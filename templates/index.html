<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Immanuel Methodist Church Nigeria</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <!-- Church Branding -->
            <div class="brand-section">

                <div class="brand-logo">
                    <img
                        src="{{ url_for('static', filename='images/methodist-logo.jpeg') }}"
                        alt="Methodist Church Nigeria Logo"
                    >
                </div>

                <h1>Immanuel Methodist Church Nigeria</h1>

            </div>

            <!-- Welcome Section -->
            <div class="welcome-section">

                <h2>Welcome</h2>

                <p>Sign in or create an account to continue.</p>

            </div>

            <!-- Authentication Options -->
            <div class="auth-options">

                <!-- Google Authentication -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID"
                     data-callback="handleCredentialResponse">
                </div>

                <div class="g_id_signin"
                    data-type="standard"
                    data-size="large"
                    data-theme="filled_black"
                    data-text="continue_with"
                    data-shape="rectangular"
                    data-logo_alignment="center">
                </div>

                <!-- Email Authentication -->
                <button type="button" class="email-button">
                    Continue with email
                </button>

            </div>

            <!-- Footer -->
            <div class="auth-footer">

                <p>
                    By continuing, you agree to our
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </p>

            </div>

        </div>

    </main>

    <script>
        async function handleCredentialResponse(response) {

            const idToken = response.credential;

            const serverResponse = await fetch("/verify-google-token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    credential: idToken
                })
            });

            const result = await serverResponse.json();

            console.log(result);
        }
    </script>

</body>

</html>
