<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Immanuel Methodist Church Nigeria | Welcome Home</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>

<body>

    <main class="landing-page">

        <div class="background-overlay"></div>

        <!-- Navigation -->
        <header class="navbar">

            <a href="/" class="brand">
                <img
                    src="{{ url_for('static', filename='images/methodist-logo.jpeg') }}"
                    alt="Immanuel Methodist Church Logo"
                >

                <div class="brand-name">
                    <span>IMMANUEL</span>
                    <small>METHODIST CHURCH NIGERIA</small>
                </div>
            </a>

            <a href="{{ url_for('admin_login') }}" class="admin-link">
                Admin Login
            </a>

        </header>

        <!-- Hero Section -->
        <section class="hero-content">

            <span class="welcome-label">
                A PLACE OF FAITH & FELLOWSHIP
            </span>

            <h1>
                Welcome<br>
                <span>Home.</span>
            </h1>

            <p>
                A place of faith, fellowship, hope and belonging.
                We are glad you're here.
            </p>

            <a href="{{ url_for('church_home') }}" class="join-button">
                JOIN THE CHURCH
                <span>→</span>
            </a>

        </section>

        <!-- Footer -->
        <footer class="landing-footer">
            <span>© 2026 Immanuel Methodist Church Nigeria</span>
            <span>Faith · Hope · Love</span>
        </footer>

    </main>

</body>

</html>
